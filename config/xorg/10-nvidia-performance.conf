# NVIDIA GPU Performance Configuration for CachyOS
# Оптимизация NVIDIA RTX 3080 для максимальной производительности

Section "Device"
    Identifier "NVIDIA GPU"
    Driver "nvidia"
    
    # Производительность и управление питанием
    Option "RegistryDwords" "PerfLevelSrc=0x3322"
    Option "PowerMizerEnable" "0"
    Option "Coolbits" "28"
    
    # Оптимизация рендеринга
    Option "AllowDFPStereo" "1"
    Option "TripleBuffer" "True"
    Option "Stereo" "0"
    
    # Multi-GPU и настройки монитора
    Option "nvidiaXineramaInfoOrder" "DFP-0"
    Option "BaseMosaic" "True"
    
    # OpenGL оптимизации
    Option "GLXVBlank" "Nvidia"
    Option "FlipQueue" "True"
    
    # Дополнительные оптимизации
    Option "UseEdidDpi" "FALSE"
    Option "DPI" "96 x 96"
EndSection

Section "Screen"
    Identifier "Screen0"
    Device "NVIDIA GPU"
    DefaultDepth 24
    
    # Оптимизация композитинга
    Option "AddARGBGLXVisuals" "True"
    Option "DamageEvents" "True"
    Option "EnablePageFlip" "True"
EndSection

Section "Extensions"
    # Включение compositor optimizations
    Option "Composite" "Enable"
EndSection