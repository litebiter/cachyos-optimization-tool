# AMD GPU Performance Configuration for CachyOS
# Universal optimization for AMD GPUs

Section "Device"
    Identifier "AMD GPU"
    Driver "amdgpu"
    
    # Performance optimizations
    Option "TearFree" "true"
    Option "DRI" "3"
    Option "AccelMethod" "glamor"
    
    # Power management
    Option "DeleteDP12" "true"
    
    # DRI3 settings
    Option "EnablePageFlip" "true"
EndSection

Section "Screen"
    Identifier "Screen0"
    Device "AMD GPU"
    DefaultDepth 24
    
    # Compositor optimizations
    Option "AllowINDirectGlx" "false"
    Option "AllowGLXWithComposite" "true"
EndSection