# CachyOS Kernel Command Line Optimizations
# Добавьте эти параметры в GRUB_CMDLINE_LINUX_DEFAULT в /etc/default/grub

# AMD P-State настройки (для AMD Ryzen 7 5700X)
amd_pstate=active

# PCIe оптимизации (для NVIDIA RTX 3080)
pcie_aspm=off
pci=nommconf

# I/O оптимизации
iommu=pt

# Производительность
nohz=off
rcu_nocbs=0-7

# Отключение отладки для производительности
quiet
loglevel=3

# Для максимальной производительности:
# processor.max_cstate=1
# intel_idle.max_cstate=0

# NVIDIA оптимизации
nvidia-drm.modeset=1
nvidia_drm.fbdev=1