# Low Latency Kernel Command Line Optimizations
# Add these parameters to GRUB_CMDLINE_LINUX_DEFAULT in /etc/default/grub

# Disable power saving features for lowest latency
processor.max_cstate=0
intel_idle.max_cstate=0

# Disable watchdog timers (reduces interrupts)
nowatchdog
nosoftlockup

# Disable audit framework (reduces overhead)
audit=0

# USB autosuspend settings (reduce input lag)
usbcore.autosuspend=-1

# Tickless mode for all cores (may not be beneficial for all systems)
# nohz_full=all

# Disable mitigations for performance (security trade-off)
# mitigations=off

# Optimize I/O for low latency
iommu=pt

# PCIe optimization for low latency
pcie_aspm=off
pci=nommconf

# CPU isolation for gaming (optional, requires manual CPU core selection)
# isolcpus=2-5

# AMD specific optimizations
amd_iommu=on
amd_pstate=active

# NVIDIA specific optimizations
nvidia-drm.modeset=1
nvidia_drm.fbdev=1
nvidia.NVregRegistryDwords=0x0a000000

# General performance
rcu_nocbs=0-7
nohz=off