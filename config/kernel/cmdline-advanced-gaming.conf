# Advanced Gaming Kernel Parameters
# Based on Reddit and Arch Wiki gaming optimization guides
# Add these parameters to GRUB_CMDLINE_LINUX_DEFAULT in /etc/default/grub

# CPU Performance Parameters
# Disable CPU security mitigations for performance (security trade-off)
# mitigations=off

# Disable C-states for lowest latency
processor.max_cstate=0
intel_idle.max_cstate=0

# Force CPU to poll instead of sleep (lowest latency, highest power)
idle=poll

# Disable watchdog timers (reduces interrupts)
nowatchdog
nosoftlockup

# Disable audit framework (reduces overhead)
audit=0

# USB optimizations for input devices
usbcore.autosuspend=-1

# PCIe optimization for maximum performance
pcie_aspm=off
pci=nommconf

# I/O optimization
iommu=pt

# Tickless mode settings
# nohz=off  # Disable tickless for consistency
# nohz_full=all  # Tickless on all cores (may not be beneficial for gaming)

# NUMA settings
# numa=off  # Disable NUMA for single-socket systems

# AMD specific optimizations
amd_iommu=on
amd_pstate=active
amdgpu.gttsize=8192  # Increase GART size for AMD GPUs

# NVIDIA specific optimizations
nvidia-drm.modeset=1
nvidia_drm.fbdev=1
nvidia.NVregRegistryDwords=0x0a000000

# Scheduler settings
rcu_nocbs=0-7

# Disable mitigations individually (alternative to mitigations=off)
# spectre_v2=off
# mds=off
# tsx_async_abort=off

# Memory management
slab_nomerge
slub_nomerge

# Additional performance parameters
mce=off
noibrs
nopat

# For hybrid graphics laptops
# video=efifb:nomanual
# video=efifb:off