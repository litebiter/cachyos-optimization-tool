# CachyOS Specific Tweaks
# Основано на официальных настройках CachyOS

# CachyOS специфичные параметры для ZRAM (если используется)
# vm.swappiness = 100  # для ZRAM - но мы используем 10 для обычной подкачки

# AMD P-State оптимизации
# Эти параметры работают вместе с amd_pstate=active в cmdline

# Сетевые оптимизации для игр
net.ipv4.udp_rmem_min = 8192
net.ipv4.udp_wmem_min = 8192

# Улучшение отзывчивости системы
kernel.sched_min_granularity_ns = 1000000
kernel.sched_wakeup_granularity_ns = 2000000

# Оптимизация для low-latency
kernel.sched_latency_ns = 20000000

# Настройки для NVMe SSD
vm.dirty_background_bytes = 67108864
vm.dirty_bytes = 536870912