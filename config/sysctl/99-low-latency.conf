# Low Latency Gaming Optimizations for CachyOS
# Based on Reddit, CachyOS Forum, and Arch Wiki recommendations

# Disable proactive compaction (reduces jitter)
# This helps keep application data in CPU cache
vm.compaction_proactiveness = 0

# Reduce watermark boost factor for better cache locality
# Defragments only one pageblock (2MB on 64-bit x86)
vm.watermark_boost_factor = 0

# Transparent hugepages settings for low latency
# "madvise" is recommended for gaming over "always"
vm.transparent_hugepage = madvise

# Disable kernel same-page merging (reduces overhead)
# Can improve latency at cost of some memory
vm.page-merge-anon-vms = 0

# Reduce pressure for cache reclaim
vm.vfs_cache_pressure = 75

# Optimize for low latency over throughput
vm.swappiness = 1

# Network optimizations for low latency gaming
net.core.netdev_max_backlog = 5000
net.core.somaxconn = 65535
net.ipv4.tcp_low_latency = 1
net.ipv4.tcp_fastopen = 3
net.ipv4.tcp_slow_start_after_idle = 0

# Disable nmi_watchdog for reduced interrupts
kernel.nmi_watchdog = 0

# Enable RT scheduling features
kernel.sched_rt_runtime_us = -1

# Optimize scheduler latency
kernel.sched_min_granularity_ns = 1000000
kernel.sched_wakeup_granularity_ns = 500000
kernel.sched_latency_ns = 10000000

# Disable split-lock detection (can introduce jitter)
kernel.split_lock_mitigate = 0