# Advanced Kernel Tweaks for Gaming Performance
# Based on Reddit, Arch Wiki, and gaming optimization guides

# Scheduler optimizations for gaming
kernel.sched_min_granularity_ns = 1000000
kernel.sched_wakeup_granularity_ns = 500000
kernel.sched_latency_ns = 10000000
kernel.sched_migration_cost_ns = 50000
kernel.sched_cfs_bandwidth_slice_us = 5000

# Enable RT scheduling features
kernel.sched_rt_runtime_us = -1
kernel.sched_rr_timeslice_ms = 3

# Disable split-lock detection (can introduce jitter)
kernel.split_lock_mitigate = 0

# Optimize for low latency over throughput
kernel.sched_autogroup_enabled = 0

# Enable aggressive throttling of page cache
vm.vfs_cache_pressure = 75

# Disable ksm and ksmd (memory deduplication - can cause latency)
vm.ksm = 0

# Transparent hugepages settings
vm.transparent_hugepage = madvise
vm.nr_hugepages = 0

# Optimize for NVMe SSDs
vm.dirty_background_bytes = 67108864
vm.dirty_bytes = 536870912

# Disable page-cluster for better latency
vm.page-cluster = 0

# Network optimizations for gaming
net.core.rmem_max = 16777216
net.core.wmem_max = 16777216
net.core.netdev_max_backlog = 5000
net.core.somaxconn = 65535
net.ipv4.tcp_low_latency = 1
net.ipv4.tcp_fastopen = 3
net.ipv4.tcp_slow_start_after_idle = 0
net.ipv4.tcp_thin_linear_timeouts = 1
net.ipv4.tcp_slow_start_after_idle = 0

# Disable TCP timestamps (reduces overhead)
net.ipv4.tcp_timestamps = 0

# Enable TCP BBR congestion control (if available)
net.core.default_qdisc = fq
net.ipv4.tcp_congestion_control = bbr

# File descriptor limits
fs.file-max = 2097152
fs.inotify.max_user_watches = 524288

# Disable swap for ultra-low latency (use with caution)
# vm.swappiness = 1